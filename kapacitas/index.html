<title>Belső oldal · Párhuzamos Történetek</title>
<style>
:root{--paper:#F4F5F3;--card:#FFFFFF;--ink:#15181B;--muted:#575E66;--line:#D6D9D6;--accent:#B5341C;--cyan:#1FBFCF;--red:#EF5A3A}
@media (prefers-color-scheme: dark){:root{--paper:#121417;--card:#1B1E22;--ink:#ECEEEC;--muted:#A3AAB1;--line:#2B3035;--accent:#FF7357;--cyan:#2FD0DE;--red:#FF6A4A;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
  font-family:Georgia,"Times New Roman",serif;padding:24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));box-sizing:border-box}
form{width:100%;max-width:360px;display:grid;gap:12px;background:var(--card);border:1px solid var(--line);padding:24px;border-radius:4px}
.label{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-family:Arial,"Helvetica Neue",sans-serif;font-size:22px;margin:0}
input{font:16px ui-monospace,Menlo,Consolas,monospace;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);width:100%;box-sizing:border-box}
button{font:500 14px ui-monospace,Menlo,Consolas,monospace;padding:10px;border:1px solid var(--ink);border-radius:4px;background:var(--ink);color:var(--paper);cursor:pointer}
button[type=submit]:hover{box-shadow:-3px -3px 0 var(--cyan),3px 3px 0 var(--red)}
.pw{position:relative}.pw input{padding-right:48px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;padding:0;border:0;background:none;color:var(--muted);display:grid;place-items:center}
.eye:hover{color:var(--ink)}.eye svg{width:20px;height:20px}.eye .off{display:none}.eye[aria-pressed=true] .on{display:none}.eye[aria-pressed=true] .off{display:block}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--accent);font-size:15px;min-height:1.4em;margin:0}
</style>
</head>

function u(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})}
async function open_(pw){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(P.s),iterations:P.r,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(P.i)},key,u(P.d)));
  try{sessionStorage.setItem("ps-int",pw)}catch(x){}
  document.open();document.write(html);document.close();
}
document.getElementById("eye").addEventListener("click",function(){
  var p=document.getElementById("p"),show=p.type==="password";p.type=show?"text":"password";
  this.setAttribute("aria-pressed",show);this.setAttribute("aria-label",show?"Jelszó elrejtése":"Jelszó megjelenítése");p.focus();
});
document.getElementById("f").addEventListener("submit",function(ev){
  ev.preventDefault();var e=document.getElementById("e");e.textContent="Megnyitás…";
  open_(document.getElementById("p").value).catch(function(){e.textContent="Hibás jelszó."});
});
try{var s=sessionStorage.getItem("ps-int");if(s)open_(s).catch(function(){})}catch(x){}
